# Deploy ecclesia to Fly when main updates.
#
# Required GitHub repo secret (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN — Fly personal access token from
#   https://fly.io/user/personal_access_tokens
#   (needs deploy access to the `ecclesia` app in fly.toml)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN is missing. Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: fly deploy
        run: flyctl deploy --remote-only --now
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
