# Deploy ecclesia to Fly when main updates.
#
# Required GitHub repo secret:
#   FLY_API_TOKEN — Fly personal access token from
#   https://fly.io/user/personal_access_tokens
#   (needs deploy access to the `ecclesia` app in fly.toml)
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy
        run: flyctl deploy --remote-only --now
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
