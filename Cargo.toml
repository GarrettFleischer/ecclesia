[workspace]
members = ["crates/domain", "crates/sdk", "crates/app"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.95"
axum = { version = "=0.8.1", features = ["form", "macros", "query"] }
axum-extra = { version = "=0.10.0", features = ["cookie"] }
chrono = { version = "=0.4.39", default-features = false, features = ["clock", "std"] }
cookie = "=0.18.1"
hex = "=0.4.3"
hmac = "=0.12.1"
idna = "=1.0.3"
idna_adapter = "=1.1.0"
indexmap = "=2.7.1"
maud = "=0.26.0"
serde = { version = "=1.0.217", features = ["derive"] }
sha2 = "=0.10.8"
tempfile = "=3.14.0"
sqlx = { version = "=0.8.2", default-features = false, features = [
    "derive",
    "runtime-tokio",
    "sqlite",
    "postgres",
] }
redis = { version = "=0.27.6", default-features = false, features = [
    "tokio-comp",
    "tokio-rustls-comp",
] }
thiserror = "=2.0.11"
time = "=0.3.37"
tokio = { version = "=1.43.0", features = ["macros", "rt-multi-thread", "net", "fs", "time"] }
tower-http = { version = "=0.6.2", features = ["fs", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
uuid = { version = "=1.11.1", features = ["v4"] }
aes-gcm = "=0.10.3"
base64 = "=0.21.7"
base64ct = "=1.6.0"
encoding_rs = "=0.8.35"
hkdf = "=0.12.4"
p256 = { version = "=0.13.2", features = ["ecdsa", "ecdh", "pem"] }
rand = { version = "=0.8.5", features = ["std", "std_rng"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "=1.0.135"
zeroize = { version = "=1.8.1", default-features = false }
argon2 = { version = "=0.5.3", features = ["std"] }
zxcvbn = "=3.1.0"
proptest = "=1.6.0"
tower = { version = "=0.5.3", features = ["util"] }
notify = "=8.2.0"
tower-livereload = "=0.9.6"
