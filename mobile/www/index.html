<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ecclesia</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #f4f0e8;
      color: #15201b;
      font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 28rem; }
    h1 { margin: 0 0 1rem; font: 400 2.75rem/1 "Iowan Old Style", "Palatino Linotype", Georgia, serif; letter-spacing: -0.02em; }
    code { font-size: 0.9em; }
    a { color: #1c3a2e; }
    @media (prefers-color-scheme: dark) {
      body { background: #0c1411; color: #eef0ea; }
      a { color: #e8d7a6; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Ecclesia</h1>
    <p>This shell loads your running server. Set the address, then sync.</p>
    <p><code>ECCLESIA_URL=https://your-host.example npx cap sync</code></p>
  </main>
</body>
</html>
