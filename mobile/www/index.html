<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ecclesia</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #f4eee3;
      color: #243126;
      font: 18px/1.45 "Source Sans 3", system-ui, sans-serif;
    }
    main { max-width: 28rem; }
    h1 { font: 640 2rem/1.15 Fraunces, Georgia, serif; }
    code { font-size: 0.9em; }
    a { color: #3a4d39; }
  </style>
</head>
<body>
  <main>
    <h1>Ecclesia</h1>
    <p>This shell loads your running server. Set the address, then sync.</p>
    <p><code>ECCLESIA_URL=https://your-host.example npx cap sync</code></p>
  </main>
</body>
</html>
